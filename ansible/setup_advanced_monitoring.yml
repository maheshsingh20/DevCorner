---
- name: Setup Advanced Monitoring with NRPE
  hosts: localhost
  become: yes
  vars:
    web_server_ip: "{{ lookup('file', '/home/ubuntu/web_server_ip.txt') }}"
  
  tasks:
    - name: Install NRPE plugin on Control Node
      apt:
        name: nagios-nrpe-plugin
        state: present

    - name: Update web server configuration with NRPE checks
      copy:
        dest: /usr/local/nagios/etc/objects/webserver.cfg
        content: |
          # Web Server Host Definition
          define host {
              use                     linux-server
              host_name               web-server-1
              alias                   Hospital App Web Server
              address                 {{ web_server_ip }}
              max_check_attempts      5
              check_period            24x7
              notification_interval   30
              notification_period     24x7
          }

          # HTTP Service Check
          define service {
              use                     generic-service
              host_name               web-server-1
              service_description     HTTP
              check_command           check_http
              notifications_enabled   1
          }

          # PING Service Check
          define service {
              use                     generic-service
              host_name               web-server-1
              service_description     PING
              check_command           check_ping!100.0,20%!500.0,60%
              notifications_enabled   1
          }

          # SSH Service Check
          define service {
              use                     generic-service
              host_name               web-server-1
              service_description     SSH
              check_command           check_ssh
              notifications_enabled   1
          }

          # Disk Usage Check via NRPE
          define service {
              use                     generic-service
              host_name               web-server-1
              service_description     Disk Usage
              check_command           check_nrpe!check_disk
              notifications_enabled   1
          }

          # CPU Load Check via NRPE
          define service {
              use                     generic-service
              host_name               web-server-1
              service_description     CPU Load
              check_command           check_nrpe!check_load
              notifications_enabled   1
          }

          # Nginx Process Check via NRPE
          define service {
              use                     generic-service
              host_name               web-server-1
              service_description     Nginx Process
              check_command           check_nrpe!check_nginx
              notifications_enabled   1
          }

    - name: Define check_nrpe command
      blockinfile:
        path: /usr/local/nagios/etc/objects/commands.cfg
        block: |
          # NRPE Command Definition
          define command {
              command_name    check_nrpe
              command_line    /usr/lib/nagios/plugins/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
          }
        marker: "# {mark} ANSIBLE MANAGED BLOCK - NRPE"

    - name: Verify Nagios configuration
      command: /usr/local/nagios/bin/nagios -v /usr/local/nagios/etc/nagios.cfg
      register: nagios_verify

    - name: Restart Nagios
      systemd:
        name: nagios
        state: restarted

    - name: Display monitoring info
      debug:
        msg:
          - "Advanced monitoring configured!"
          - "Monitoring: HTTP, PING, SSH, Disk, CPU, Nginx"
          - "Access Nagios dashboard to view all checks"
